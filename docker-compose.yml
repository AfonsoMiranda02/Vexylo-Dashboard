version: '3.8'

services:
  db:
    image: postgres:15
    container_name: vexylo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: superdashboard
    ports:
      - "2050:5432"
    labels:
      - "vexylo.project=true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: vexylo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vexylo.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "2070:80"
    labels:
      - "vexylo.project=true"
    depends_on:
      - db
    restart: unless-stopped

  api:
    build: ./backend-api
    container_name: vexylo_api
    ports:
      - "2060:2060"
    environment:
      - DATABASE_URL=postgresql://postgres:supersecretpassword@db:5432/superdashboard
    volumes:
      - ./backend-api:/app
    labels:
      - "vexylo.project=true"
    depends_on:
      - db
    restart: unless-stopped
    # Para ler os processos do host (Windows/Linux local), PID namespace do host e privileges:
    pid: "host"
    privileged: true

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: vexylo_docker_proxy
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "vexylo.project=true"
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce
    container_name: vexylo_portainer
    command: -H tcp://docker-proxy:2375
    ports:
      - "2080:9000"
    depends_on:
      - docker-proxy
    labels:
      - "vexylo.project=true"
    restart: unless-stopped

volumes:
  postgres_data: